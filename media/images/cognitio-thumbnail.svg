<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240">
  <rect width="400" height="240" rx="8" fill="#F0EDE3"/>

  <defs>
    <radialGradient id="node-grad" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#C8C8A0"/>
      <stop offset="100%" stop-color="#7A7A50"/>
    </radialGradient>
  </defs>

  <!-- Neural graph (centered, scaled from proposal logo) -->
  <g transform="translate(200,120) scale(0.85)">
    <!-- Shadow layer -->
    <g transform="translate(3,4)" opacity="0.1">
      <circle cx="0" cy="-72" r="11" fill="#6B5530"/>
      <circle cx="-56" cy="-14" r="9" fill="#6B5530"/>
      <circle cx="56" cy="-14" r="9" fill="#6B5530"/>
      <circle cx="-82" cy="56" r="7" fill="#6B5530"/>
      <circle cx="0" cy="72" r="11" fill="#6B5530"/>
      <circle cx="82" cy="56" r="7" fill="#6B5530"/>
    </g>

    <!-- Connecting lines -->
    <line x1="0" y1="-72" x2="-56" y2="-14" stroke="#9B9B6B" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="-72" x2="56" y2="-14" stroke="#9B9B6B" stroke-width="1.5" opacity="0.6"/>
    <line x1="-56" y1="-14" x2="-82" y2="56" stroke="#9B9B6B" stroke-width="1.5" opacity="0.6"/>
    <line x1="-56" y1="-14" x2="0" y2="72" stroke="#9B9B6B" stroke-width="1.5" opacity="0.6"/>
    <line x1="56" y1="-14" x2="0" y2="72" stroke="#9B9B6B" stroke-width="1.5" opacity="0.6"/>
    <line x1="56" y1="-14" x2="82" y2="56" stroke="#9B9B6B" stroke-width="1.5" opacity="0.6"/>
    <!-- Cross connections for richer graph -->
    <line x1="-56" y1="-14" x2="56" y2="-14" stroke="#9B9B6B" stroke-width="1" opacity="0.3"/>
    <line x1="-82" y1="56" x2="0" y2="72" stroke="#9B9B6B" stroke-width="1" opacity="0.3"/>
    <line x1="82" y1="56" x2="0" y2="72" stroke="#9B9B6B" stroke-width="1" opacity="0.3"/>

    <!-- Nodes -->
    <circle cx="0" cy="-72" r="11" fill="url(#node-grad)"/>
    <circle cx="-56" cy="-14" r="9" fill="url(#node-grad)"/>
    <circle cx="56" cy="-14" r="9" fill="url(#node-grad)"/>
    <circle cx="-82" cy="56" r="7" fill="url(#node-grad)"/>
    <circle cx="0" cy="72" r="11" fill="url(#node-grad)"/>
    <circle cx="82" cy="56" r="7" fill="url(#node-grad)"/>
  </g>
</svg>
